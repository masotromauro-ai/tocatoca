const CAPITULOS = [
    { parte: "Parte I — Fundamentos", id: "cap0", titulo: "Cap. 0 — El código de color", body: (React.createElement(React.Fragment, null,
            React.createElement("div", { className: "rounded-xl p-4 mb-4 border", style: { background: "#0a0a0a", borderColor: "#333333" } },
                React.createElement("p", { className: "text-[10px] uppercase tracking-widest mb-2", style: { color: "#8a8a8a" } }, "Antes de empezar"),
                React.createElement("p", { className: "text-sm text-gray-300 leading-relaxed" }, "Antes de que este sistema te ahorre un solo segundo de c\u00E1lculo, te va a pedir algo: que te aprendas doce colores de memoria, con la misma seriedad con la que en alg\u00FAn momento te aprendiste el nombre de las doce notas. Esto no es gratis, y vale la pena decirlo as\u00ED, sin vueltas, en la primera p\u00E1gina: hay una inversi\u00F3n inicial antes de que aparezca la ganancia. Cualquier m\u00E9todo serio la tiene \u2014el solfeo, la digitaci\u00F3n, las escalas\u2014 y este no es la excepci\u00F3n.")),
            React.createElement(CapP, null, "Lo que s\u00ED cambia es qu\u00E9 est\u00E1s memorizando. No est\u00E1s memorizando teor\u00EDa todav\u00EDa. Est\u00E1s memorizando una paleta: doce parches de color, cada uno con un nombre de nota al lado. Nada m\u00E1s. La teor\u00EDa llega despu\u00E9s, cap\u00EDtulo a cap\u00EDtulo, apoyada en esa memorizaci\u00F3n \u2014 pero si lleg\u00E1s al cap\u00EDtulo de acordes sin tener el color automatizado, vas a estar leyendo colores en vez de reconoci\u00E9ndolos, y ah\u00ED el sistema entero pierde su funci\u00F3n."),
            React.createElement(CapH3, null, "El orden en que conviene aprenderlo"),
            React.createElement(CapP, null, "Este libro presenta la paleta en tres pasos, cada uno con un prop\u00F3sito distinto."),
            React.createElement(PasoCard, { n: "1", titulo: "Primero, una tira" }, "Las doce notas en fila, igual que las teclas de un piano o de un bandone\u00F3n desplegadas en l\u00EDnea recta. Es la forma m\u00E1s directa de un primer contacto \u2014 no hay \u00E1ngulos que leer, no hay geometr\u00EDa que entender todav\u00EDa. Solo doce colores, uno al lado del otro, cada uno con su nombre."),
            React.createElement(PasoCard, { n: "2", titulo: "Despu\u00E9s, la rueda" }, "Las mismas doce notas, ahora en c\u00EDrculo. Ac\u00E1 aparece algo que la tira no pod\u00EDa mostrar: que las notas no son una lista que termina, sino un ciclo que vuelve sobre s\u00ED mismo \u2014 la relaci\u00F3n circular entre semitonos que vas a necesitar m\u00E1s adelante para entender intervalos, el c\u00EDrculo de quintas, y la geometr\u00EDa de los acordes del cap\u00EDtulo 8."),
            React.createElement(PasoCard, { n: "3", titulo: "Por \u00FAltimo, tarjetas de estudio" },
                "Una nota por vez, con su color y su enarm\u00F3nico (por ejemplo, Do sostenido y Re bemol comparten color). Este es el paso de memorizaci\u00F3n activa propiamente dicho: repetici\u00F3n, no explicaci\u00F3n. Es donde el c\u00F3digo deja de ser informaci\u00F3n y empieza a ser reflejo. (Pod\u00E9s practicar esto en la pesta\u00F1a ",

    { parte: "Parte I — Fundamentos", id: "cap1", titulo: "Cap. 1 — Introducción", body: (React.createElement(React.Fragment, null,
            React.createElement(CapP, null, "Pens\u00E1 en un cifrado de jazz cualquiera. Un La13."),
            React.createElement(CapP, null, "Para leerlo, no alcanza con saber que es un acorde de La. Hay que reconstruir la escala de La, contar seis grados hacia arriba, recordar que la \"trecena\" es en realidad la sexta trasladada una octava, y llegar \u2014reci\u00E9n ah\u00ED\u2014 al Fa sostenido. Todo eso, en el tiempo que dura un comp\u00E1s, muchas veces varios acordes seguidos, en tiempo real, mientras segu\u00EDs tocando."),
            React.createElement(CapP, null, "Ese c\u00E1lculo mental es exactamente el problema que este libro intenta resolver. No reemplazando la teor\u00EDa \u2014hace falta saber que el La13 lleva el Fa sostenido, eso no cambia\u2014, sino agreg\u00E1ndole una capa de reconocimiento instant\u00E1neo por encima del c\u00E1lculo: si cada una de las doce notas tiene un color fijo y propio, ver el Fa sostenido en una partitura, en un cifrado o en un diagrama de acorde deja de ser una operaci\u00F3n aritm\u00E9tica y pasa a ser una percepci\u00F3n directa. Un color no se calcula. Se reconoce."),
            React.createElement(CapH3, null, "Para qu\u00E9 sirve esto, en la pr\u00E1ctica"),
            React.createElement(CapP, null, "Antes de entrar en el sistema, conviene decir con toda claridad qu\u00E9 es este libro y qu\u00E9 no es. No es un tratado de teor\u00EDa del color con la m\u00FAsica como excusa, ni una manera nueva de aprender armon\u00EDa. Es un manual de estudio, pensado para alguien que va a pasar meses \u2014tal vez un a\u00F1o\u2014 practicando un instrumento, y que en ese tiempo se va a topar una y otra vez con cifrados y partituras que hay que leer m\u00E1s r\u00E1pido de lo que se los puede calcular. El color no cambia qu\u00E9 es un La13. Cambia cu\u00E1nto tarda el ojo en encontrarlo."),
            React.createElement(CapP, null, "Con el tiempo \u2014y esto no hace falta forzarlo, aparece solo con la pr\u00E1ctica\u2014 el color tambi\u00E9n empieza a mostrar patrones: por qu\u00E9 ciertos acordes \"se sienten\" parecidos, por qu\u00E9 una progresi\u00F3n suena como suena. El cap\u00EDtulo 8 lleva esto un paso m\u00E1s all\u00E1 y muestra que cada tipo de acorde traza una figura geom\u00E9trica fija sobre la rueda de colores. Para algunos cerebros \u2014los que procesan mejor una forma espacial que una f\u00F3rmula\u2014 eso suma una capa m\u00E1s de reconocimiento. No es necesario para el uso b\u00E1sico del sistema, pero est\u00E1 ah\u00ED para quien lo aproveche."),
            React.createElement(CapP, null, "Y hay una \u00FAltima capa, todav\u00EDa m\u00E1s opcional: el cap\u00EDtulo de piedras preciosas y energ\u00EDa (Parte IV) conecta este sistema con la litoterapia y la sanaci\u00F3n por sonido. Eso es tradici\u00F3n, no m\u00E9todo de estudio \u2014lo va a disfrutar quien ya tenga un inter\u00E9s personal en esos temas, desde la salud o la espiritualidad, y quien no, puede saltearlo sin perderse nada del sistema central."),
            React.createElement(CapH3, null, "Qu\u00E9 vas a encontrar en este libro"),
            React.createElement(CapP, null, "El coraz\u00F3n del libro es un mapeo completo y sistem\u00E1tico: las doce notas de la escala crom\u00E1tica, cada una con un color propio, consistente, y derivado por una l\u00F3gica expl\u00EDcita de mezcla \u2014no elegido al azar ni por est\u00E9tica. De ah\u00ED en m\u00E1s, el libro recorre c\u00F3mo ese sistema se comporta con acordes, tonalidades, el c\u00EDrculo de quintas, y termina en aplicaciones pr\u00E1cticas: lectura r\u00E1pida de partituras, reconocimiento de acordes, y s\u00ED \u2014 entender de un vistazo qu\u00E9 nota es la trecena de cualquier cifrado que tengas enfrente."),
            React.createElement(CapP, null, "Los cinco primeros colores de ese mapeo \u2014los que sostienen la pentat\u00F3nica original\u2014 tienen adem\u00E1s una historia de origen, ligada al shakuhachi, la flauta de bamb\u00FA japonesa. Vale la pena decirlo desde ac\u00E1: esa historia es un adorno, no el argumento. Ayuda a memorizar los primeros cinco colores con una imagen en vez de una tabla, y tiene su propio encanto \u2014pero el sistema no depende de ella. Si ma\u00F1ana se olvida la leyenda, la rueda de colores y su l\u00F3gica de mezcla siguen intactas."),
            React.createElement(CapH3, null, "A qui\u00E9n est\u00E1 dirigido"),
            React.createElement(CapP, null, "A cualquiera que quiera leer m\u00FAsica m\u00E1s r\u00E1pido de lo que puede calcularla. No hace falta formaci\u00F3n previa en teor\u00EDa \u2014el libro construye los conceptos desde la base\u2014, pero va a resultar especialmente \u00FAtil para quien ya toca y se topa, una y otra vez, con el mismo problema del La13: saber la teor\u00EDa, y aun as\u00ED tardar un segundo de m\u00E1s en encontrar la nota."),
            React.createElement(CapP, null, "El n\u00FAcleo te\u00F3rico-crom\u00E1tico del sistema es universal \u2014 vale para cualquier instrumento. Pero la aplicaci\u00F3n pr\u00E1ctica (c\u00F3mo se traduce un color en un movimiento de mano) s\u00ED depende del instrumento, as\u00ED que este libro desarrolla en profundidad el bandone\u00F3n y el piano \u2014 los dos instrumentos donde el autor puede dar ejemplos de primera mano \u2014 y deja abierta, como expansi\u00F3n futura, la traducci\u00F3n a otros instrumentos (guitarra, cuerdas, vientos)."))) },

            React.createElement(CapP, null, "Antes de entrar en el sistema propiamente dicho, conviene alinear dos vocabularios: el de la m\u00FAsica y el del color. No porque sean el mismo lenguaje \u2014no lo son\u2014, sino porque este libro va a moverse todo el tiempo entre los dos, y ayuda tener claro qu\u00E9 concepto de un lado corresponde, aproximadamente, a qu\u00E9 concepto del otro."),

            React.createElement(CapP, null,

                " En su tratado ",

                ", un sistema donde cada tonalidad ten\u00EDa un color asignado, pensado para proyectarse en un teclado de luces (el ",
                React.createElement("i", null, "clavier \u00E0 lumi\u00E8res"),
                ") durante la ejecuci\u00F3n. Orden\u00F3 las doce tonalidades seg\u00FAn el c\u00EDrculo de quintas y les asign\u00F3 colores siguiendo el orden del espectro visible \u2014lo cual quiere decir que, dibujado en c\u00EDrculo de quintas, su sistema es un arco\u00EDris perfecto, y dibujado en orden crom\u00E1tico, es un desorden completo. Es la elecci\u00F3n inversa a la de este libro, que privilegia el orden crom\u00E1tico por sobre el de quintas."),
            React.createElement(CapP, null,
                React.createElement("b", { className: "text-gray-200" }, "Nikolai Rimsky-Korsakov (siglo XIX)."),
                " A diferencia de Newton y Scriabin, Rimsky-Korsakov no dise\u00F1\u00F3 un sistema: describ\u00EDa una sinestesia que dec\u00EDa percibir espont\u00E1neamente. Por eso sus colores no siguen ninguna l\u00F3gica geom\u00E9trica, y por eso choc\u00F3 p\u00FAblicamente con Scriabin \u2014para uno, Do mayor era blanco; para el otro, rojo\u2014. Ninguno de los dos estaba \"equivocado\": estaban describiendo experiencias distintas, no midiendo el mismo fen\u00F3meno."),
            React.createElement(CapP, null,
                React.createElement("b", { className: "text-gray-200" }, "Gong-Shang-Jue-Zhi-Yu (China, antig\u00FCedad)."),
                " El precedente m\u00E1s antiguo y, para este libro, el m\u00E1s significativo: un sistema pentat\u00F3nico \u2014Gong, Shang, Jue, Zhi, Yu, equivalentes a Do-Re-Mi-Sol-La\u2014 vinculado desde hace milenios a los cinco elementos (Wu Xing) y sus colores tradicionales: tierra-amarillo, metal-blanco, madera-verde, fuego-rojo, agua-negro/azul. No coincide con los colores de este libro, pero es la prueba de que la idea central \u2014pentat\u00F3nica m\u00E1s color m\u00E1s naturaleza\u2014 tiene una tradici\u00F3n real y antigua, no inventada para la ocasi\u00F3n."),
            React.createElement(CapImgPend, { texto: "comparativa de los cuatro sistemas hist\u00F3ricos (Newton, Scriabin, Rimsky-Korsakov, Gong-Shang-Jue-Zhi-Yu) uno al lado del otro." }),
            React.createElement(CapP, null, "Ning\u00FAn sistema hist\u00F3rico coincide con otro. Eso no es una falla del proyecto: es la evidencia de que este cruce siempre fue, y siempre va a ser, una construcci\u00F3n simb\u00F3lica \u2014nunca un hecho descubierto. Este libro no pretende ser la excepci\u00F3n. Pretende, en cambio, ser el m\u00E1s expl\u00EDcito y mejor justificado de todos."))) },
    { parte: "Parte I — Fundamentos", id: "cap4", titulo: "Cap. 4 — La historia del shakuhachi", body: (React.createElement(React.Fragment, null,
            React.createElement(CapP, null, "Antes de entrar en la historia, una aclaraci\u00F3n de peso: lo que sigue es el origen romanceado de los primeros cinco colores, no el argumento que sostiene el sistema. El argumento est\u00E1 en el cap\u00EDtulo 5, donde esos cinco colores se combinan por mezcla y generan matem\u00E1ticamente el resto de la rueda. Esta historia es, en cambio, la forma m\u00E1s simple de memorizar el punto de partida \u2014 una imagen en vez de una tabla \u2014 y funciona bien precisamente porque no pretende ser m\u00E1s que eso."),
            React.createElement(CapP, null, "Antes de cualquier historia, hay una certeza que no necesita relato para sostenerse: en espa\u00F1ol, la nota Sol comparte nombre con el astro Sol \u2014 y el sol, a simple vista, es amarillo. No hace falta ninguna leyenda para afirmar que Sol es amarillo: es la correspondencia m\u00E1s firme de todo el sistema, la verdad de la que se parte, no una hip\u00F3tesis m\u00E1s entre varias. Todo lo dem\u00E1s se construye a partir de ah\u00ED, y vuelve ah\u00ED cada vez que hace falta un punto fijo."),
            React.createElement(CapP, null, "Lo que sigue en este cap\u00EDtulo tiene un estatus distinto, y conviene decirlo con esa claridad: es una historia transmitida de viva voz, sin registro documentado, contada por un amigo \u2014luthier e int\u00E9rprete de shakuhachi, la flauta de bamb\u00FA japonesa, que construy\u00F3 instrumentos con ca\u00F1as tra\u00EDdas de Tailandia\u2014. No es el origen de todo el sistema. Es un relato rom\u00E1ntico, probablemente modificado con los a\u00F1os como toda historia oral, que se incluye ac\u00E1 no como fundamento sino como acompa\u00F1amiento \u2014 en gran parte porque tiene una coincidencia genuina que vale la pena se\u00F1alar: en la propia historia, cuando aparece la nota asociada a la vida, aparece tambi\u00E9n el rojo \u2014 la sangre, el coraz\u00F3n. Esa coincidencia no prueba nada, pero suma, y por eso tiene un lugar en el libro."),
            React.createElement(CapImgPend, { texto: "ilustraci\u00F3n atmosf\u00E9rica de la leyenda (monta\u00F1a, sol, cielo, pasto, ganado a la distancia) \u2014 a generar en Midjourney." }),
            React.createElement(CapP, null, "Con esa jerarqu\u00EDa clara \u2014Sol-amarillo como certeza, el resto como historia oral que acompa\u00F1a\u2014, as\u00ED es como se cuenta:"),
            React.createElement(CapP, null, "Antes de que existiera una escala como tal, alguien mira hacia arriba y ve el sol \u2014claro, luminoso\u2014. De ah\u00ED nace la primera referencia: Sol es amarillo."),
            React.createElement(CapP, null, "Despu\u00E9s el cielo: Do es azul. Despu\u00E9s lo que crece bajo los pies, el pasto de la monta\u00F1a: Re es verde. Despu\u00E9s la tierra y la piedra de la monta\u00F1a misma: Mi es marr\u00F3n. Y por \u00FAltimo, lejos, el color de la vida \u2014el ganado, la gente a la distancia\u2014: La es rojo."),
            React.createElement(CapFig, { caption: "La pentat\u00F3nica original: Do, Re, Mi, Sol, La. Azul, verde, marr\u00F3n, amarillo, rojo." },
                React.createElement(TiraCromatica, { highlight: ["C", "D", "E", "G", "A"] })),
            React.createElement(CapP, null, "Con el tiempo, cuando la m\u00FAsica se volvi\u00F3 m\u00E1s compleja y se agregaron las notas \"de en medio\" \u2014Fa y Si\u2014, esas dos no heredaron un color de la leyenda. Y no hace falta que lo tengan: la pentat\u00F3nica es, en gran parte del mundo, la capa m\u00E1s antigua de la m\u00FAsica \u2014China, \u00C1frica, los Andes, la m\u00FAsica celta, el propio shakuhachi\u2014, y agregar notas despu\u00E9s es, hist\u00F3ricamente, lo normal. Fa y Si son esa segunda capa. El cap\u00EDtulo 5 muestra de d\u00F3nde sale, entonces, su color."))) },
    { parte: "Parte I — Fundamentos", id: "cap5", titulo: "Cap. 5 — De la pentatónica al cromatismo", body: (React.createElement(React.Fragment, null,
            React.createElement(CapP, null, "Los cinco colores de origen no se quedan aislados: se combinan entre s\u00ED, por mezcla directa, para generar los siete colores restantes y completar la rueda de doce."),
            React.createElement(CapP, null, "Do (azul) y Re (verde) se mezclan y dan Do sostenido, celeste \u2014 una mezcla v\u00E1lida en dos sentidos a la vez, porque el celeste, a diferencia del resto, es tambi\u00E9n un color espectral real: existe f\u00EDsicamente en la luz, entre el azul y el verde. Re (verde) y Mi (marr\u00F3n) dan Re sostenido, un oliva que resulta de la mezcla real entre ambos. Mi (marr\u00F3n) y Sol (amarillo) dan, en dos pasos, Fa y Fa sostenido \u2014un dorado que se aclara a medida que se acerca al amarillo\u2014. Sol (amarillo) y La (rojo) se mezclan y dan Sol sostenido, naranja. Y por \u00FAltimo, La (rojo) y Do (azul) se mezclan y dan Si, violeta \u2014que a su vez, mezclado otra vez con La, da Sib, rosa\u2014."),
            React.createElement(CapP, null, "El marr\u00F3n merece una aclaraci\u00F3n aparte, porque a primera vista parece \"romper\" el espectro: no existe una banda de luz que produzca marr\u00F3n. T\u00E9cnicamente es un naranja oscurecido y desaturado, un color que solo existe por mezcla o por sombra, nunca en un prisma. Eso significa que ubicarlo donde lo ubica la leyenda \u2014entre el verde y el amarillo\u2014 no viola ninguna ley \u00F3ptica: el marr\u00F3n nunca tuvo un lugar \"correcto\" en el espectro que este sistema est\u00E9 alterando."),
            React.createElement(CapFig, { caption: "Figura 5. Las cinco notas ancla y las mezclas que completan la rueda de doce." },
                React.createElement(RuedaCromatica, { highlight: ["C", "D", "E", "G", "A"] })),
            React.createElement(CapP, null,
                "Y ac\u00E1 aparece un cierre que no estaba planeado, pero que sostiene el argumento con una precisi\u00F3n que vale la pena se\u00F1alar: Fa y Si, las dos notas sin historia propia, est\u00E1n exactamente a distancia de tritono entre s\u00ED \u2014seis semitonos\u2014. El tritono es, en m\u00FAsica, el intervalo de mayor tensi\u00F3n e inestabilidad. Y en este sistema de color, es tambi\u00E9n el \u00FAnico intervalo cuya relaci\u00F3n crom\u00E1tica es un ",
                React.createElement("b", null, "complementario exacto"),
                " \u2014el par de colores de m\u00E1ximo contraste posible en toda la rueda\u2014. Las dos notas que llegaron despu\u00E9s, sin mito de origen, resultan ser las que generan, al mismo tiempo, la m\u00E1xima tensi\u00F3n arm\u00F3nica y el m\u00E1ximo contraste visual. No hizo falta forzarlo: es consecuencia directa de aplicar la misma l\u00F3gica hasta el final."))) },
    { parte: "Parte I — Fundamentos", id: "cap5bis", titulo: "Cap. 5bis — Una variante real: el espectro continuo", body: (React.createElement(React.Fragment, null,
            React.createElement(CapP, null,
                "Todo lo construido hasta ac\u00E1 \u2014la leyenda del shakuhachi, la mezcla pentat\u00F3nica, el marr\u00F3n de Mi que en realidad es un naranja ensombrecido\u2014 pertenece a lo que este libro va a llamar, de ahora en m\u00E1s, la ",
                React.createElement("b", null, "paleta de estudio"),
                ". Es una paleta pensada para ense\u00F1ar: cada color tiene una historia, una raz\u00F3n, un porqu\u00E9 que se puede contar en una frase. Eso es, exactamente, lo que la vuelve memorable \u2014 y tambi\u00E9n lo que la vuelve, en un sentido estricto, artificial: nadie en la naturaleza mezcla marr\u00F3n con amarillo para producir un color intermedio, porque el marr\u00F3n no es un color de la luz."),
            React.createElement(CapP, null, "Pero hay preguntas que la paleta de estudio no est\u00E1 pensada para responder bien. Si dos o tres notas se combinan en un acorde, \u00BFqu\u00E9 pasa si en vez de mezclar el marr\u00F3n de Mi lo que se mezcla es un matiz continuo, sin sombras narrativas de por medio? Para eso este libro construye una segunda paleta, con un criterio completamente distinto: no contar una historia, sino calcular con la mayor coherencia f\u00EDsica posible dentro del mismo sistema temperado de doce colores."),
            React.createElement(CapP, null, "Esta segunda paleta \u2014la paleta real, o espectral\u2014 parte de los tres \u00FAnicos anclajes que este libro considera innegociables, porque no dependen de una leyenda sino de una coincidencia de idioma y de percepci\u00F3n directa: Do es azul (el cielo), Sol es amarillo (el sol, con el mismo nombre en espa\u00F1ol) y La es rojo. Entre esos tres puntos fijos, en vez de mezclar colores nota por nota como hizo el cap\u00EDtulo 5, la paleta real interpola un matiz continuo alrededor de toda la rueda, sin agregar ning\u00FAn color a mano. El resultado es una rueda que s\u00ED es, de punta a punta, un espectro real: no hay marr\u00F3n, no hay oliva, no hay beige \u2014 hay una progresi\u00F3n ininterrumpida de matiz, igual que un arco\u00EDris continuo doblado en c\u00EDrculo."),
            React.createElement(CapP, null, "Esto tiene un costo, y conviene decirlo con la misma honestidad que sostuvo el cap\u00EDtulo anterior: al interpolar matem\u00E1ticamente, la paleta real pierde la justificaci\u00F3n individual de cada color. Mi ya no es \"la tierra de la monta\u00F1a\" \u2014 es, simplemente, el matiz que le toca por posici\u00F3n entre el verde de Re y el amarillo de Sol. Se gana continuidad f\u00EDsica; se pierde historia. Es la raz\u00F3n por la que este libro nunca usa la paleta real para ense\u00F1ar el sistema por primera vez."),
            React.createElement("div", { className: "grid sm:grid-cols-2 gap-4 my-4" },
                React.createElement(CapFig, { caption: "Paleta de estudio \u2014 narrativa" },
                    React.createElement(RuedaCromatica, { size: 220 })),
                React.createElement(CapFig, { caption: "Paleta real \u2014 calculada en vivo (interpolaci\u00F3n de matiz Do\u2192Sol\u2192La)" },
                    React.createElement(RuedaCromatica, { size: 220, usePaletteReal: true }))),
            React.createElement(CapNota, null, "Esta segunda rueda se calcula ac\u00E1 mismo, en la app, con el m\u00E9todo que describe el libro (interpolaci\u00F3n circular de matiz entre las tres anclas). No es una paleta fija ni \"oficial\" \u2014 es una demostraci\u00F3n en vivo del criterio del cap\u00EDtulo, para comparar contra la paleta de estudio."),
            React.createElement(CapP, null, "Las dos paletas conviven a prop\u00F3sito, cada una con su funci\u00F3n: la de estudio para aprender y reconocer, la real para calcular mezclas de acordes con un criterio m\u00E1s f\u00EDsicamente coherente cuando se necesita esa precisi\u00F3n. Ninguna de las dos es \"la verdadera\". Las dos son honestas sobre lo que sacrifican, y esa honestidad \u2014no una f\u00F3rmula descubierta\u2014 es lo que sostiene todo el sistema."))) },
    { parte: "Parte II — El sistema en profundidad", id: "cap6", titulo: "Cap. 6 — La correspondencia de la tercera", body: (React.createElement(React.Fragment, null,
            React.createElement(CapP, null, "Hay una pregunta que este sistema no pod\u00EDa dejar sin responder: \u00BFpor qu\u00E9 el marr\u00F3n \u2014justamente el color m\u00E1s \"irregular\" de toda la rueda\u2014 cae exactamente en Mi, la tercera de la t\u00F3nica?"),
            React.createElement(CapP, null, "La respuesta no es solo narrativa. En armon\u00EDa, la tercera de un acorde es la nota que decide si ese acorde es mayor o menor. La fundamental y la quinta son estructurales, estables, casi neutras; la tercera es la que \"ti\u00F1e\" el car\u00E1cter emocional del acorde entero. Por eso, en la jerga de la armon\u00EDa, muchos m\u00FAsicos la llaman directamente \"la nota de color\" del acorde \u2014mucho antes de que existiera este libro."),
            React.createElement(CapP, null, "El marr\u00F3n, en teor\u00EDa del color, cumple una funci\u00F3n estructuralmente id\u00E9ntica: no es un matiz propio, es una modificaci\u00F3n de valor y saturaci\u00F3n sobre otro color \u2014un naranja oscurecido\u2014. No aporta una identidad nueva: aporta una sombra sobre una identidad existente."),
            React.createElement(CapP, null, "La nota cuya funci\u00F3n musical es matizar la armon\u00EDa es representada, con coherencia real y no solo po\u00E9tica, por la familia de color cuya funci\u00F3n \u00F3ptica es exactamente matizar en lugar de aportar un color propio. Es la misma l\u00F3gica que despu\u00E9s aparece, otra vez, en el mundo mineral: el mismo ion de cromo produce rojo en el rub\u00ED y verde en la esmeralda, dependiendo \u00FAnicamente de la estructura que lo aloja. La identidad no cambia. La expresi\u00F3n s\u00ED, seg\u00FAn el contexto. Ese principio \u2014contexto que define expresi\u00F3n sin alterar identidad\u2014 es, en el fondo, el que sostiene a todo el libro."),
            React.createElement(CapH3, null, "La tercera como nota de color, en cualquier tonalidad"),
            React.createElement(CapP, null, "Todo lo anterior se explic\u00F3 con Do como ejemplo, pero el principio es transportable a las doce tonalidades. Tomemos Sol sostenido, que en este sistema es naranja \u2014la mezcla entre Sol y La\u2014. Su quinta es siempre Re sostenido (oliva), sea la tonalidad mayor o menor: la quinta es estructural y no cambia el car\u00E1cter del acorde. Lo que s\u00ED cambia es la tercera: en Sol sostenido mayor, la tercera es Do (azul); en Sol sostenido menor, la tercera es Si (violeta). Dos colores completamente distintos matizando el mismo naranja de base, solo por el cambio de un semitono en la tercera \u2014 la manifestaci\u00F3n crom\u00E1tica exacta de lo que ese semitono hace arm\u00F3nicamente."),
            React.createElement("div", { className: "grid grid-cols-2 gap-3 my-4" },
                React.createElement(MixFigure, { titulo: "Sol# mayor (Sol#\u2013Do\u2013Re#)", notes: ["G#", "C", "D#"], nota: "Fundamental naranja + tercera mayor (Do, azul) + quinta oliva." }),
                React.createElement(MixFigure, { titulo: "Sol# menor (Sol#\u2013Si\u2013Re#)", notes: ["G#", "B", "D#"], nota: "Misma fundamental y quinta \u2014 la tercera menor (Si, violeta) ti\u00F1e todo el acorde distinto." })),
            React.createElement(CapP, null,
                "Esto se repite, con sus propios valores, para cualquiera de las doce t\u00F3nicas \u2014 probalo en la pesta\u00F1a ",
                React.createElement("b", null, "Acorde"),
                " con cualquier acorde mayor y su relativo menor."))) },
    { parte: "Parte II — El sistema en profundidad", id: "cap7", titulo: "Cap. 7 — El doble temperamento", body: (React.createElement(React.Fragment, null,
            React.createElement(CapP, null, "Este es el cap\u00EDtulo bisagra: todo lo anterior construye hacia ac\u00E1, y todo lo que sigue lo aplica."),
            React.createElement(CapP, null, "La m\u00FAsica occidental temperada no usa las proporciones \"puras\" de la afinaci\u00F3n natural \u2014la serie arm\u00F3nica\u2014. Las ajusta, deliberadamente, para poder dividir la octava en doce semitonos exactamente iguales. Es una decisi\u00F3n pr\u00E1ctica, no un descubrimiento: se sacrifica la pureza ac\u00FAstica para ganar un sistema funcional y transportable a cualquier tonalidad."),
            React.createElement(CapP, null, "Este libro hace, con el color, exactamente el mismo gesto. Y para demostrarlo \u2014no solo para afirmarlo\u2014 se pusieron a prueba tres intentos distintos de encontrar una correspondencia f\u00EDsica real entre sonido y color, y los tres, de manera consistente, fallaron:"),
            React.createElement(CapP, null,
                React.createElement("b", { className: "text-gray-200" }, "Primero"),
                ", el espectro de luz real no tiene el mismo tama\u00F1o que una octava musical \u2014ocupa apenas menos de una octava\u2014, as\u00ED que ning\u00FAn mapeo directo de frecuencia de sonido a frecuencia de luz logra que las doce notas entren completas en el rango visible: algo siempre queda afuera, en infrarrojo o ultravioleta."),
            React.createElement(CapP, null,
                React.createElement("b", { className: "text-gray-200" }, "Segundo"),
                ", incluso usando la t\u00E9cnica v\u00E1lida de elevar una frecuencia de audio cuarenta octavas para llevarla al rango de luz visible, el resultado no coincide con los colores de este sistema \u2014 de hecho invierte varias asignaciones (Do termina siendo infrarrojo, invisible; La termina siendo naranja, no rojo)."),
            React.createElement(CapP, null,
                React.createElement("b", { className: "text-gray-200" }, "Tercero"),
                ", se compararon las propiedades f\u00EDsicas reales de las doce piedras preciosas elegidas para cada nota \u2014densidad, dureza, \u00EDndice de refracci\u00F3n\u2014 contra la frecuencia sonora de cada nota. La correlaci\u00F3n estad\u00EDstica fue pr\u00E1cticamente cero en los tres casos."),
            React.createElement(CapNota, null,
                "Tres intentos, tres resultados negativos, siempre de la misma manera. Y ese patr\u00F3n repetido es, en s\u00ED mismo, el argumento central de todo el libro: si alguno de esos tres intentos hubiera arrojado una correlaci\u00F3n fuerte, ser\u00EDa motivo de sospecha, no de celebraci\u00F3n. Que los tres fallen limpiamente confirma que este es un sistema ",
                React.createElement("b", null, "temperado"),
                ": construido con criterios expl\u00EDcitos y defendibles, no derivado de una f\u00F3rmula de la naturaleza. Y sin embargo, el sistema funciona \u2014porque nunca pretendi\u00F3 ser un hallazgo. Pretendi\u00F3, desde el principio, ser un lenguaje."),
            React.createElement(CapH3, null, "Un anclaje real, sin necesidad de leyenda"),
            React.createElement(CapP, null, "Todo lo anterior son intentos de correspondencia f\u00EDsica que fallaron, y este libro los cuenta igual porque el fracaso ordenado es parte del argumento. Pero hay una sola nota, en todo el sistema, que s\u00ED tiene un anclaje f\u00EDsico real, verificable y ajeno a cualquier leyenda: el La. No por ninguna propiedad de su color \u2014la idea de que el rojo sea \"el primer color que percibe el ojo\" circula bastante, pero no resiste una revisi\u00F3n m\u00EDnima: seg\u00FAn qu\u00E9 estudio se consulte, el primer matiz en aparecer en el umbral de percepci\u00F3n es el amarillo, no el rojo, y no hay acuerdo real entre las fuentes."),
            React.createElement(CapP, null, "Lo que el La s\u00ED tiene, y que ninguna otra nota de la escala tiene, es un anclaje universalmente estandarizado: los 440 Hz del diapas\u00F3n, la referencia de afinaci\u00F3n de la m\u00FAsica occidental (norma ISO 16), el punto del que parte cualquier instrumento que se afina hoy. No es una leyenda ni una elecci\u00F3n est\u00E9tica \u2014 es, probablemente, el hecho m\u00E1s verificable de todo este libro."),
            React.createElement(CapP, null, "Y en este sistema, el La ya es rojo desde el cap\u00EDtulo 4 \u2014la vida, la sangre, a la distancia\u2014, sin que hiciera falta ajustar nada para lograrlo. Que la \u00FAnica nota con anclaje f\u00EDsico real termine siendo tambi\u00E9n el color de mayor intensidad simb\u00F3lica de la leyenda no es una prueba de nada, pero s\u00ED es una segunda capa de sentido que vale la pena se\u00F1alar."))) },
    { parte: "Parte II — El sistema en profundidad", id: "cap8", titulo: "Cap. 8 — El círculo de quintas en color", body: (React.createElement(React.Fragment, null,
            React.createElement(CapP, null, "El c\u00EDrculo de quintas \u2014la forma en que las tonalidades se organizan por su distancia arm\u00F3nica, no por su distancia crom\u00E1tica\u2014 revela algo que el c\u00EDrculo crom\u00E1tico simple no muestra."),
            React.createElement(CapP, null, "Cada salto de una quinta equivale, en la rueda de doce colores de este sistema, a un giro constante de 210 grados. No es un n\u00FAmero cualquiera: coincide con relaciones que la teor\u00EDa del color ya nombra formalmente."),
            React.createElement(CapP, null,
                "El ",
                React.createElement("b", null, "tritono"),
